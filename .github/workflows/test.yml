name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Synthetic smoke run
        run: python -m fruitfly_brain.main --source mock --brain connectome --frames 30 --no-journal
      - name: Render the demo end to end
        run: |
          pip install ".[demo]"
          python examples/render_demo.py /tmp/demo.gif --frames 12
