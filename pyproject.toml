[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly-brain"
version = "0.4.0"
description = "Camera-to-robot bridge with a spiking neural backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["Pillow>=10", "matplotlib>=3.7"]

[project.scripts]
fruitfly-brain = "fruitfly_brain.main:main"

[project.urls]
Homepage = "https://github.com/fruitflyxyz/fruitfly-brain"
Repository = "https://github.com/fruitflyxyz/fruitfly-brain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
